name: Refresh external RSS headlines
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: external-rss-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch publisher RSS
        run: python3 scripts/fetch-feeds.py
      - name: Save refreshed headlines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/feed-snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh external RSS headlines'
          git push
